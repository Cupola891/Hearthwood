function questList(){const b=S.quest.br;return QUESTS.filter(q=>!q.br||q.br===b)}
function curQuest(){if(!S.quest)S.quest={i:0};if(S.quest.off)return null;return questList()[S.quest.i]||null}
function questStart(q){
  if(q.start==='msg'&&!S.quest.msg){addMsg('Taskmaster','Well done, you found your messages. Other players write to you here, and so do I. Come back to me for your next task.');S.quest.msg=S.msgs[0].id}
  if(q.start==='nb'&&!S.quest.nb){const v=strongestNeighbour();if(v)S.quest.nb=v.id}
  if(q.start==='rep'&&!S.quest.rep){addReport('A word from the Taskmaster','<p>Reports arrive here after battles, raids, trades and other news. Check them often.</p>','info');S.quest.rep=S.reports[0].id}
}
const questNb=()=>S.quest&&S.quest.nb&&S.ai?S.ai.vil[S.quest.nb]:null;
function questReady(){const q=curQuest();if(!q||q.ask||q.choose)return false;if(q.pay)return capV().res[3]>=q.pay[3];try{return !!q.ok()}catch(e){return false}}
function giveRes(r){const cv=capV();withV(cv,()=>{const c=caps();for(let i=0;i<4;i++)V.res[i]=Math.min(c[i],V.res[i]+r[i])})}
function questReward(q){
  if(q.rw==='wood'){const cv=capV(),j=cv.jobs.find(j=>B[j.b].field===0);if(j){j.end=Date.now()-1;advance(Date.now())}return 'Your Woodcutter is finished.'}
  if(q.rw==='tok'){S.tokens=(S.tokens||0)+4;return 'You received 4 free resource-field upgrades, each good for taking one field from level 2 to level 3. Use them from that field’s window.'}
  if(q.rw==='rat')return 'Your mighty army has arrived: one rat. It ran off into the fields. Perhaps that was the lesson.';
  if(q.rw){giveRes(q.rw);return 'Reward: '+q.rw.map((v,i)=>`${ICON[i]}${v}`).join(' ')}
  return '';
}
function questDone(msg){S.quest.i++;save();render();openQuest(msg)}
function openQuest(flash){
  advance(Date.now());dlgState=null;const q=curQuest();
  if(!q){openDlg('Taskmaster',`${flash?`<div class="qflash">${flash}</div>`:''}<p>${S.quest&&S.quest.off?'You set the tasks aside.':'That is everything I can teach you. The rest of the world is yours to discover. Good luck!'}</p>`);return}
  questStart(q);save();renderTop();
  const list=questList(),n=S.quest.i+1,rw=q.rw==='wood'?q.rwText:q.rw==='rat'?'An army.':q.rw==='tok'?'4 free resource-field upgrades from level 2 to level 3.':q.rw?`<div class="cost">${q.rw.map((v,i)=>`<span>${ICON[i]}${v}</span>`).join('')}</div>`:'<span class="muted">None</span>';
  let act='';
  if(q.choose)act=`<button class="btn" onclick="questBranch('M')">Military</button> <button class="btn" onclick="questBranch('E')">Economy</button>`;
  else if(q.ask==='xy')act=`<div style="display:flex;gap:6px;align-items:center">x <input id="qx" type="number" style="width:70px"> y <input id="qy" type="number" style="width:70px"> <button class="btn" onclick="questAnswer()">Submit</button></div>`;
  else if(q.ask)act=`<div style="display:flex;gap:6px;align-items:center">${q.ask} <input id="qa" type="number" style="width:90px"> <button class="btn" onclick="questAnswer()">Submit</button></div>`;
  else if(q.pay)act=capV().res[3]>=q.pay[3]?`<button class="btn" onclick="questCollect()">Hand over 200 crop</button>`:'<p class="muted">You don’t have 200 crop in your capital yet.</p>';
  else act=questReady()?`<button class="btn" onclick="questCollect()">Collect reward</button>${overflowNote(q.rw)}`:'<p class="muted">Not done yet. Come back when it’s finished.</p>';
  openDlg(`Taskmaster · task ${n} of ${list.length}`,`${flash?`<div class="qflash">${flash}</div>`:''}<h3>${q.t}</h3><p><i>“${q.say}”</i></p><p><b>Task:</b> ${typeof q.task==='function'?q.task():q.task}</p><div style="margin:6px 0"><b>Reward:</b> ${rw}</div>${act}
   <p style="margin-top:14px;font-size:12px"><a href="#" onclick="if(confirmSkip.armed){S.quest.off=1;save();render();openQuest()}else{confirmSkip.armed=1;this.textContent='Click again to skip all remaining tasks'}return false">Skip the tasks</a></p>`);
  confirmSkip.armed=0;
  const f=document.getElementById('qa')||document.getElementById('qx');if(f)setTimeout(()=>f.focus(),0);
}

  if(!lost.some(x=>x>0))return '';return ` <span style="color:var(--bad);font-size:12.5px">Not enough storage room: ${lost.map((v,i)=>v>0?`${fmt(v)} ${RES[i].toLowerCase()}`:'').filter(Boolean).join(', ')} would be lost.</span>`}
function questCollect(){const q=curQuest();if(!q)return;advance(Date.now());
  if(q.pay){const cv=capV();if(cv.res[3]<q.pay[3])return toast('Not enough crop.');for(let i=0;i<4;i++)cv.res[i]-=q.pay[i]}
  else if(!questReady())return toast('That task is not finished yet.');

function questAnswer(){const q=curQuest();if(!q)return;let ok;

  const tot=V.res.reduce((a,v)=>a+Math.floor(v),0),c=caps(),v=npcVals(),sum=v.reduce((a,b)=>a+b,0),left=tot-sum;
  document.getElementById('npcsum').textContent=fmt(sum);

  const msg=over.length?`<span style="color:var(--bad)">That’s more ${over.join(' and ')} than you can store.</span>`:left>0?`<span class="muted">${fmt(left)} left to hand out.</span>`:left<0?`<span style="color:var(--bad)">That’s ${fmt(-left)} more than you have.</span>`:'<span style="color:var(--good)">All set.</span>';

function npcEven(){const tot=V.res.reduce((a,v)=>a+Math.floor(v),0),c=caps();let left=tot;const out=[0,0,0,0];
  for(let pass=0;pass<4&&left>0;pass++){const open=[0,1,2,3].filter(i=>out[i]<c[i]);if(!open.length)break;const each=Math.floor(left/open.length);for(const i of open){const add=Math.min(each,c[i]-out[i]);out[i]+=add;left-=add}}
  for(let i=0;i<4&&left>0;i++){const add=Math.min(left,c[i]-out[i]);out[i]+=add;left-=add}
  out.forEach((v,i)=>document.getElementById('npc'+i).value=v);npcSum()}
function npcRest(){const tot=V.res.reduce((a,v)=>a+Math.floor(v),0),c=caps(),v=npcVals();let left=tot-v.reduce((a,b)=>a+b,0);

  for(const i of order){if(left<=0)break;const add=Math.min(left,c[i]-v[i]);if(add>0){v[i]+=add;left-=add}}

  q.innerHTML=`<h3>Building:</h3><table>${V.jobs.slice().sort((a,b)=>a.end-b.end).map(j=>
   `<tr><td style="width:20px"><button class="x" title="Cancel" onclick="cancelJob('${j.key}')">✕</button></td>
     <td>${B[j.b].n} <span class="lvl">Level ${j.l}</span></td>
     <td class="t">${hms((j.end-now)/1000)} hrs.</td><td class="t muted">done at ${clock(j.end)}</td></tr>`).join('')}</table>`;
  }
function render(){
  renderTop();renderPanels();
  {let b=document.getElementById('wonbar');if(S.over&&!b){b=document.createElement('div');b.id='wonbar';b.style.cssText='position:fixed;left:50%;bottom:10px;transform:translateX(-50%);background:#5b2a86;color:#fff;padding:8px 16px;border-radius:8px;z-index:50;font-weight:bold';document.body.appendChild(b)}if(b)b.textContent=S.over?`The world was won by ${S.over.who}. You can keep playing.`:''}
  const page=document.getElementById('page'),stage=document.getElementById('stage'),isPage=['stat','rep','msg','man','ally'].includes(view);
  page.style.display=isPage?'block':'none';stage.style.display=isPage?'none':'block';
  if(isPage){page.innerHTML=view==='ally'?pageAlly():view==='man'?pageManual():view==='stat'?pageStats():view==='rep'?pageReports(S.pageSel):pageMessages();renderSide();renderTop()}
  renderQueue();updateQBtn();
  if(view==='map'&&S.quest&&!S.quest.map)questMap();
  if(view==='res')renderRes();else if(view==='map')renderMap();else if(!isPage)renderVil();
  if(V.starved){toast(`${fmt(V.starved)} troops in ${V.name} deserted because there was no crop.`);V.starved=0;save()}
  renderQueue();
}
function setView(v){if(!['res','vil','map','stat','rep','msg','man','ally'].includes(v))return;view=v;S.pageSel=undefined;render()}
function openPage(k,sel){view=k;S.pageSel=sel;render()}
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- dialogs ---------- */
function openDlg(title,html){document.getElementById('dlgc').innerHTML=`<div class="hd">${title}</div><div class="bd">${html}</div>`;document.getElementById('modal').classList.add('open');placeDlg()}
let dlgOff={x:0,y:0};
function placeDlg(){const d=document.getElementById('dlg'),r=d.getBoundingClientRect(),bx=r.left-dlgOff.x,by=r.top-dlgOff.y;
  dlgOff.x=Math.max(-bx,Math.min(innerWidth-r.width-bx,dlgOff.x));dlgOff.y=Math.max(-by,Math.min(innerHeight-40-by,dlgOff.y));
  d.style.transform=`translate(${dlgOff.x}px,${dlgOff.y}px)`}
document.addEventListener('mousedown',e=>{const hd=e.target.closest&&e.target.closest('#dlg .hd');if(!hd||e.button)return;e.preventDefault();
  const sx=e.clientX-dlgOff.x,sy=e.clientY-dlgOff.y;
  const mv=ev=>{dlgOff.x=ev.clientX-sx;dlgOff.y=ev.clientY-sy;placeDlg()},up=()=>{removeEventListener('mousemove',mv);removeEventListener('mouseup',up)};
  addEventListener('mousemove',mv);addEventListener('mouseup',up)});
function closeDlg(){document.getElementById('modal').classList.remove('open');dlgState=null}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeDlg()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDlg()});
let dlgState=null;

function costRow(c,showTime,phOn){
  return `<div class="cost">${c.map((v,i)=>`<span class="${V.res[i]<v?'short':''}">${ICON[i]}${fmt(v)}${phOn?PH:''}</span>`).join('')}${showTime||''}</div>`;
}
function actionHtml(k,b,l){
  const why=canStart(k,b,l),c=cost(b,l);
  const pv=!B[b].verified,pc=pv&&!B[b].vc;
  const t=`<span title="Build time with your current Main Building">⏱ ${hms(buildTime(b,l))}${pv?PH:''}</span><span title="Crop upkeep">👥 +${upkeep(b,l)}${pc?PH:''}</span>`;
  let h=costRow(c,t,pc);
  const tokBtn=B[b].field!==undefined&&l===3&&(S.tokens||0)>0&&(!why||why==='short')?` <button class="btn" style="background:#3f7fb5" onclick="startBuild('${k}',${b},${l},1)" title="Upgrade without paying">Use a free upgrade (${S.tokens} left)</button>`:'';
  if(!why)h+=`<button class="btn" onclick="startBuild('${k}',${b},${l})">${l===1?'Build':'Upgrade to level '+l}</button>${tokBtn}`;
  else if(why==='short'){
    const w=whenAffordable(c);
    h+=`<button class="btn" disabled>${l===1?'Build':'Upgrade to level '+l}</button><div class="why">Not enough resources${w?` — enough at ${clock(w)}${w-Date.now()>86400000?' ('+new Date(w).toLocaleDateString()+')':''}`:''}.</div>`+tokBtn;
  }else h+=`<button class="btn" disabled>${l===1?'Build':'Upgrade to level '+l}</button><div class="why">${why}</div>`;
  return h;
}
function levelTable(b,from){
  const rows=[];
  for(let l=Math.max(1,from);l<=Math.min(B[b].max,from+5);l++){const c=cost(b,l);
    const pv=!B[b].verified?PH:'',pc=!B[b].verified&&!B[b].vc?PH:'';
    rows.push(`<tr><td>${l}</td>${c.map(v=>`<td>${fmt(v)}${pc}</td>`).join('')}<td>${hms(buildTime(b,l))}${pv}</td>${B[b].field!==undefined?`<td>${fmt(PROD[l]*S.speed)}</td>`:''}</tr>`)}
  return `<table class="lv"><tr><th>Lvl</th>${ICON.map(i=>`<th>${i}</th>`).join('')}<th>Time</th>${B[b].field!==undefined?'<th>/hour</th>':''}</tr>${rows.join('')}</table>`;
}
function effectLine(b,l){
  const d=B[b];
  if(d.field!==undefined)return `Current production: <b>${fmt(PROD[l]*S.speed)}</b> per hour${l<d.max?` · at level ${l+1}: <b>${fmt(PROD[l+1]*S.speed)}</b> per hour`:''}`;
  const sp=n=>'',cm=TR()==='G'?2:1;
  if(b===10||b===11)return `Capacity: <b>${fmt(STORE[l])}${sp(l)}</b>${l<d.max?` · at level ${l+1}: <b>${fmt(STORE[l+1])}${sp(l+1)}</b>`:''}`;
  if(b===23)return `Hides <b>${fmt(CRANNY[l]*cm)}</b> of each resource${l<d.max?` · at level ${l+1}: <b>${fmt(CRANNY[l+1]*cm)}</b>`:''}`;
  if(b===15)return `Construction time: <b>${Math.round(Math.pow(.964,l-1)*100)}%</b>${l<d.max?` · at level ${l+1}: <b>${Math.round(Math.pow(.964,l)*100)}%</b>`:''}`;
  if(WALLB[b])return `Defence bonus: <b>+${((wallBonus(b,l)-1)*100).toFixed(1)}%</b>${l<d.max?` · at level ${l+1}: <b>+${((wallBonus(b,l+1)-1)*100).toFixed(1)}%</b>`:''}`;
  const nx=(f,u='')=>`<b>${f(l)}${u}</b>${l<d.max?` · at level ${l+1}: <b>${f(l+1)}${u}</b>`:''}`;
  if(b===17)return `Merchants: ${nx(x=>x)}`;
  if(b===18)return `Alliance members you can lead: ${nx(x=>x*3)}`;
  if(b===12||b===13)return `${b===12?'Weapon':'Armour'} upgrades up to level ${nx(x=>x)}`;
  if(b===14)return `Troops beyond 30 fields move ${nx(x=>'+'+x*10,'%')} faster`;
  if(b===19||b===20||b===21||b===29||b===30)return `Training time: ${nx(x=>Math.round(Math.pow(.9,x-1)*100),'%')}`;
  if(b===24)return `Celebration time: ${nx(x=>Math.round(Math.pow(.964,x-1)*100),'%')}${l<10?' · great celebrations from level 10':''}`;
  if(b===34)return `Capital buildings ${nx(x=>'+'+x*10,'%')} sturdier against catapults`;
  if(b===35)return `Mead festival attack bonus: ${nx(x=>'+'+x,'%')}`;
  if(b===36)return `Traps: ${nx(x=>fmt(trapsAt(x)))}`;
  if(b===41)return `Cavalry training ${nx(x=>'−'+x,'%')} · ${l>=20?'Legati, Imperatoris and Caesaris':l>=15?'Legati and Imperatoris':l>=10?'Equites Legati':'no units yet'} eat one crop less`;
  if(d.bonus!==undefined)return `${RES[d.bonus]} bonus: <b>+${l*5}%</b>${l<d.max?` · at level ${l+1}: <b>+${(l+1)*5}%</b>`:''}`;
  return '';
}
function openSlot(k,tab){
  advance(Date.now());
  dlgState={k,tab};
  const sl=V.slots[k],j=jobAt(k);
  if(sl&&(sl.l>0||j||isField(k))){
    const b=sl.b,l=sl.l,next=slotTarget(k)+1,d=B[b];
    let h=`<p>${d.d}</p><p>${effectLine(b,l)}</p>`;
    if(!d.verified)h+=`<div class="note">Numbers marked ${PH} come from my notes and still need checking against the classic game.</div>`;
    if(j)h+=`<p><b>Under construction:</b> level ${j.l}, done in ${hms((j.end-Date.now())/1000)} (at ${clock(j.end)}).</p>`;
    if(next<=maxLvl(b)&&!j)h+=`<div class="bopt"><div class="nm">Costs for upgrading to level ${next}:</div>${actionHtml(k,b,next)}</div>`;
    else if(l>=maxLvl(b))h+=`<p><b>${d.n} is fully upgraded${maxLvl(b)<d.max?' (level 10 is the limit outside your capital)':''}.</b></p>`;
    h+=`<details style="margin-top:8px"><summary>Upcoming levels</summary>${levelTable(b,next)}</details>`;
    if(l>0)h+=extraSection(b);
    openDlg(`${d.n} <span class="lvl">Level ${l}</span>`,h);
    return;
  }
  // empty site
  let opts=[];
  if(k==='rp')opts=[16];
  else if(k==='wall')opts=[TRIBES[TR()].wall];
  else if(k==='mb')opts=[15];
  else opts=Object.keys(B).map(Number).filter(b=>!B[b].fixed&&B[b].field===undefined&&b!==15);
  const now=[],soon=[];
  for(const b of opts){
    const p=(B[b].fixed||b===15)?{ok:true,req:reqList(b)}:placeable(b);
    if(p.hide)continue;
    (p.ok?now:soon).push([b,p]);
  }
  tab=tab||'now';
  const render1=([b,p])=>`<div class="bopt"><div class="nm">${B[b].n}</div><div>${B[b].d}</div>
     ${p.ok?actionHtml(k,b,1):`${costRow(cost(b,1),'',!B[b].verified&&!B[b].vc)}${p.why?`<div class="why">${p.why}</div>`:''}${p.req?`<div class="req">Requires: ${p.req.map(r=>`<span class="${r.ok?'ok':'no'}">${B[r.id].n} level ${r.l}</span>`).join(', ')}</div>`:''}`}</div>`;
  const h=`${opts.length>1?`<div class="tabs"><button class="${tab==='now'?'on':''}" onclick="openSlot('${k}','now')">Available (${now.length})</button><button class="${tab==='soon'?'on':''}" onclick="openSlot('${k}','soon')">Soon available (${soon.length})</button></div>`:''}
   ${(tab==='now'?now:soon).map(render1).join('')||'<p class="muted">Nothing here yet.</p>'}`;
  openDlg('Construct new building',h);
  dlgState={k,tab};
}
function renameVillage(){openDlg('Rename village',`<input type="text" id="rn" maxlength="30" value="${esc(V.name)}" style="width:100%"><div style="margin-top:10px"><button class="btn" onclick="doRename()">Save</button></div>`);setTimeout(()=>document.getElementById('rn').focus(),0)}
function doRename(){const n=document.getElementById('rn').value.trim();if(n){V.name=n.slice(0,30);save()}closeDlg();render()}
function toast(msg){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t)}
  t.textContent=msg;t.className='show';clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='',3000)}
const isOwner=()=>!CO.on||CO.uid===CO.owner;
function openSettings(){
  if(!isOwner())return openDlg('Settings',`<label class="f">Player name</label><input type="text" id="pn" value="${esc(S.player)}">
   <div class="note">Game speed and opponents are set by the world's creator, ${esc(CO.owner||'')}.</div>
   <div style="margin-top:12px"><button class="btn" onclick="applySettings()">Save</button></div>`);
  openDlg('Settings',`<label class="f">Game speed</label>
   <select id="spd">${[1,2,3,5,10,100].map(v=>`<option value="${v}" ${S.speed===v?'selected':''}>×${v}${v===1?' (classic)':v===100?' (testing)':''}</option>`).join('')}</select>
   <div class="note">Speed multiplies production and divides build times. Work already in progress keeps its finish time.</div>
   <label class="f">Player name</label><input type="text" id="pn" value="${esc(S.player)}">
   <label class="f">Computer opponents</label>
   <div style="display:flex;gap:8px"><select id="oppn">${[0,150,1000,3000,10000].map(n=>`<option value="${n}" ${S.ai&&S.ai.count===n?'selected':''}>${fmt(n)}</option>`).join('')}</select>
   <select id="oppm">${Object.keys(MIXES).map(k=>`<option value="${k}" ${S.ai&&S.ai.mix===k?'selected':''}>${k[0].toUpperCase()+k.slice(1)}</option>`).join('')}</select>
   <button class="btn grey" onclick="rebuildAI()">Rebuild opponents</button></div>
   <div class="note">Aggression sets the personality mix — Peaceful has mostly builders and casual players; Harsh has many raiders and veterans. Rebuilding replaces every opponent (your villages stay) and gives you a fresh beginner's protection.</div>
   <div style="margin-top:12px;display:flex;gap:8px"><button class="btn" onclick="applySettings()">Save</button>
   ${CO.on?`<button class="btn grey" style="background:#b23b2b;border-color:#8a2a1e;color:#fff" onclick="askDeleteWorld()">Delete this world…</button>`:`<button class="btn grey" onclick="resetGame()">Start a new game…</button>`}</div>
   ${CO.on?'<div class="note">Changes here apply to everyone in this world.</div>':''}`);
}
function askDeleteWorld(){openDlg('Delete this world?',`<p>This deletes the whole world for everyone: every village, yours and your friends', and all the opponents. It can't be undone.</p><button class="btn" style="background:#b23b2b;border-color:#8a2a1e" onclick="deleteWorld()">Delete the world</button> <button class="btn grey" onclick="closeDlg()">Keep it</button>`)}
async function deleteWorld(){if(!isOwner())return;CO.on=false;closeDlg();showNet('Deleting the world…');
  try{CO.db.ref(`worlds/${CO.wid}/lease`).onDisconnect().cancel()}catch(e){}
  await CO.db.ref(`worlds/${CO.wid}`).remove();try{localStorage.removeItem('hw-pw-'+CO.pub)}catch(e){}location.href=location.pathname}
function rebuildAI(){if(CO.on){if(S.me!==CO.owner)return;if(CO.role!=='host'&&!CO.headless){closeDlg();return toast('Sent to the host: the opponents are being rebuilt.')}}
  advance(Date.now());S.moves=S.moves.filter(m=>m.from);S.oases={};S.offers=null;
  if(CO.on){// keep every human and their villages; only the computer players are replaced
    const me=S.me;stash();const hum=S.ai.players.filter(p=>p.human),vs=hum.flatMap(p=>p.vids.map(id=>S.ai.vil[id]).filter(Boolean));
    aiSetup(+document.getElementById('oppn').value,document.getElementById('oppm').value);
    const t=Date.now();for(const p of hum){p.protEnd=p.prodEnd=t+72*3600000/S.speed;S.ai.players.push(p)}for(const v of vs){S.ai.vil[v.id]=v;S.ai.at[v.x+','+v.y]=v.id}
    aiIndex();_pcacheFor=null;unstash(me);worldChanged();save();closeDlg();return}
  aiSetup(+document.getElementById('oppn').value,document.getElementById('oppm').value);save();closeDlg();render();toast('Opponents rebuilt.')}
function applySettings(){advance(Date.now());const sp=document.getElementById('spd');if(sp&&(!CO.on||S.me===CO.owner)){S.speed=+sp.value;if(CO.on&&CO.role==='host')worldChanged()}const pn=document.getElementById('pn').value.trim();if(pn)S.player=pn.slice(0,24);save();closeDlg();render()}
function resetGame(){openDlg('Start a new game?',`<p>This deletes your village and all progress.</p><button class="btn" style="background:#b23b2b;border-color:#8a2a1e" onclick="doReset()">Delete and start over</button> <button class="btn grey" onclick="closeDlg()">Cancel</button>`)}
function doReset(){if(CO.on){location.href=location.pathname;return}try{localStorage.removeItem(SAVE_KEY)}catch(e){}_dirty=false;idbPut(SAVE_KEY,null).catch(()=>{});S=null;closeDlg();showStart()}
function showStart(){
  openDlg('A new village',`<p>Choose your people and name your first village.</p>
   <div class="tribes">${Object.entries(TRIBES).filter(([k])=>k!=='X').map(([k,t],i)=>`<label><input type="radio" name="tr" value="${k}" ${i===0?'checked':''}><div><b>${t.n}</b><div class="note">${t.info}</div></div></label>`).join('')}</div>
   <label class="f">Village name</label><input type="text" id="vn" value="New village" maxlength="30">
   <label class="f">Start in</label><select id="quad"><option value="">A random quadrant</option><option value="++">North-east (+|+)</option><option value="+-">South-east (+|−)</option><option value="--">South-west (−|−)</option><option value="-+">North-west (−|+)</option></select>
   <label class="f">Game speed</label><select id="sp"><option value="1">×1 (classic)</option><option value="3">×3</option><option value="10">×10</option><option value="100">×100 (testing)</option></select>
   <label class="f">Computer opponents</label><div style="display:flex;gap:8px"><select id="oppn">${[0,150,1000,3000,10000].map(n=>`<option value="${n}" ${n===10000?'selected':''}>${fmt(n)}</option>`).join('')}</select>
   <select id="oppm"><option value="peaceful">Peaceful</option><option value="normal" selected>Normal</option><option value="harsh">Harsh</option></select></div>
   <div class="note">At least half join right away and the rest over 3–5 days; half as many again arrive between days 5 and 21. About a third give up 5–21 days after they start. You start with beginner's protection.</div>
   ${FB_CONFIG?`<label style="display:flex;gap:6px;align-items:center;margin-top:10px"><input type="checkbox" id="coop" onchange="document.getElementById('copw').style.display=this.checked?'':'none'"> Play this world co-op with friends (online)</label>
   <div id="copw" style="display:none"><label class="f">World password (your friends will need it to join)</label><input type="text" id="copwi" maxlength="40" autocomplete="off"></div>`:''}
   <div style="margin-top:14px"><button class="btn" onclick="beginGame()">Found village</button></div>`);
  document.querySelector('#dlg .close').style.display='none';

let coopPw='';
function beginGame(){
  {const co=document.getElementById('coop'),pw=document.getElementById('copwi');if(co&&co.checked){coopPw=(pw&&pw.value||'').trim();if(coopPw.length<4)return toast('Pick a world password of at least 4 characters.')}}
  const tr=document.querySelector('input[name=tr]:checked').value;
  newGame.opp=+document.getElementById('oppn').value;newGame.mix=document.getElementById('oppm').value;newGame.quad=document.getElementById('quad').value;
  newGame(tr,document.getElementById('vn').value.trim(),+document.getElementById('sp').value);
  document.querySelector('#dlg .close').style.display='';closeDlg();render();
  const co=document.getElementById('coop');if(co&&co.checked)coopCreate(coopPw);

/* ---------- main loop ---------- */
function tick(){if(!S||!V||!S.villages||!S.villages.length)return;
  if(!S)return;
  const changed=advance(Date.now());
  const typing=document.activeElement&&['INPUT','SELECT'].includes(document.activeElement.tagName);
  if(changed){save();if(!drag||!drag.on){render();if(dlgState&&!typing)openSlot(dlgState.k,dlgState.tab)}}
  else{{const nt=document.getElementById('npct');if(nt)nt.textContent=shortT(npcLeft())}{const k=unread('reports')+'|'+unread('msgs');if(k!==renderTop.k)renderTop();else renderBar()}renderQueue();updateQBtn();if(!document.activeElement||!['mx','my'].includes(document.activeElement.id))renderSide();renderPanels()}
}
// a long absence on a big world is simulated in slices so the page stays responsive
async function catchUp(){
  if(!S||!S.ai)return;const step=Math.max(60000,3600000/S.speed),now=Date.now(),total=now-S.ai.last;
  if(total<step*20)return;
  const ov=document.createElement('div');ov.id='catchup';ov.style.cssText='position:fixed;inset:0;background:rgba(40,30,15,.55);display:flex;align-items:center;justify-content:center;z-index:999';
  ov.innerHTML='<div class="board" style="width:360px;text-align:center"><h3 style="margin:0 0 8px">The world moved on while you were away</h3><div style="height:10px;background:#e8dcc0;border-radius:5px;overflow:hidden"><div id="cubar" style="height:100%;width:0;background:#5c9a3c"></div></div><p class="muted" id="cutxt" style="margin:8px 0 0"></p></div>';
  document.body.appendChild(ov);catchUp.on=true;
  while(S.ai.last+step<=now){const t0=performance.now();while(S.ai.last+step<=now&&performance.now()-t0<60)aiCatchUp(Math.min(now,S.ai.last+step));
    const f=1-(now-S.ai.last)/total;document.getElementById('cubar').style.width=(f*100).toFixed(1)+'%';document.getElementById('cutxt').textContent=`${Math.round(f*100)}%`;
    await new Promise(r=>setTimeout(r,0))}
  catchUp.on=false;ov.remove();
}
// dev mode: Ctrl+Shift+D toggles the testing buttons (remembered on this browser); ?dev in the address turns it on
function devMode(on){document.body.classList.toggle('devon',on);try{localStorage.setItem('hearthwood-dev',on?'1':'')}catch(e){}}
try{if(localStorage.getItem('hearthwood-dev')==='1'||/[?&]dev\b/.test(location.search))document.body.classList.add('devon')}catch(e){}
document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.shiftKey&&(e.key==='D'||e.key==='d')){e.preventDefault();devMode(!document.body.classList.contains('devon'))}});
(async()=>{
  const wid=new URLSearchParams(location.search).get('w');
  if(wid&&FB_CONFIG&&await coopBoot(wid)){setInterval(()=>{if(!catchUp.on&&S)tick()},1000);return}
  try{load.txt=await idbGet(SAVE_KEY)}catch(e){}
  if(!load.txt)try{load.txt=localStorage.getItem(SAVE_KEY)}catch(e){}
  load();
  if(S){await catchUp();advance(Date.now());save();render()}else{S=null;showStart()}
  setInterval(()=>{if(!catchUp.on)tick()},1000);
  setInterval(()=>S&&_dirty&&saveNow(),30000);
  window.addEventListener('beforeunload',()=>S&&(_dirty=true,saveNow()));
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&S){_dirty=true;saveNow()}});
})();
